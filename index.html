<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت کلینیک دندانپزشکی</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>سیستم مدیریت کلینیک دندانپزشکی</h1>

        <form id="patientRegistrationForm">
            <h2>فرم ثبت بیمار جدید</h2>

            <div>
                <label for="full_name">نام و نام خانوادگی:</label>
                <input type="text" id="full_name" name="full_name" placeholder="مثال: علی رضایی" required>
            </div>

            <div>
                <label for="phone_number">شماره تماس:</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹" required>
            </div>

            <div>
                <label for="age">سن:</label>
                <input type="number" id="age" name="age" placeholder="مثال: ۳۰">
            </div>

            <div>
                <label for="gender">جنسیت:</label>
                <select id="gender" name="gender">
                    <option value="">انتخاب کنید...</option>
                    <option value="مرد">مرد</option>
                    <option value="زن">زن</option>
                    <option value="سایر">سایر</option>
                </select>
            </div>

            <div>
                <label for="marital_status">وضعیت تاهل:</label>
                <select id="marital_status" name="marital_status">
                    <option value="">انتخاب کنید...</option>
                    <option value="مجرد">مجرد</option>
                    <option value="متاهل">متاهل</option>
                </select>
            </div>

            <div>
                <label for="address">آدرس:</label>
                <textarea id="address" name="address" placeholder="آدرس کامل منزل"></textarea>
            </div>

            <div>
                <label for="medical_history">سابقه بیماری:</label>
                <textarea id="medical_history" name="medical_history" placeholder="سابقه بیماری‌های خاص یا مزمن"></textarea>
            </div>

            <div>
                <label for="allergies">آلرژی‌ها:</label>
                <textarea id="allergies" name="allergies" placeholder="حساسیت‌های دارویی یا غذایی"></textarea>
            </div>

            <div>
                <label for="insurance_info">اطلاعات بیمه:</label>
                <textarea id="insurance_info" name="insurance_info" placeholder="نام بیمه، شماره بیمه و ..."></textarea>
            </div>

            <div>
                <label for="general_notes">توضیحات عمومی:</label>
                <textarea id="general_notes" name="general_notes" placeholder="هرگونه توضیح یا نکته اضافی"></textarea>
            </div>

            <div>
                <label for="patientFile">پیوست فایل (اختیاری):</label>
                <input type="file" id="patientFile" name="patientFile">
            </div>

            <button type="submit">ثبت بیمار</button>
        </form>

        <section id="patientDisplayArea">
            <h2>لیست بیماران</h2>
            <!-- Patient data will be displayed here -->
        </section>
    </div>

    <!-- Link to JavaScript file will be added later -->
    <script src="js/scripts.js" defer></script>
</body>
</html>
